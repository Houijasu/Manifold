[package]
name = "mf-uci"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# The engine is pure NNUE: there is no hand-crafted evaluation to fall back on, so a
# build that cannot find a network cannot play at all. Embedding it by default makes
# that state unreachable no matter which directory a GUI launches the engine from.
default = ["embedded-net"]
embedded-net = ["mf-nnue/embedded-net"]
# Reserved for the not-yet-implemented `manifold train` subcommand.
train = []

[[bin]]
name = "manifold"
path = "src/main.rs"

[dependencies]
mf-core = { path = "../mf-core" }
mf-datagen = { path = "../mf-datagen" }
mf-nnue = { path = "../mf-nnue" }
mf-search = { path = "../mf-search" }
