[workspace]
members = [
    "crates/mf-core",
    "crates/mf-nnue",
    "crates/mf-search",
    "crates/mf-uci",
    "crates/mf-datagen",
    "crates/mf-tune",
    "crates/mf-lab",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Manifold contributors"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
