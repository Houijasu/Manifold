[workspace]
members = [
    "crates/mf-core",
    "crates/mf-nnue",
    "crates/mf-search",
    "crates/mf-uci",
    "crates/mf-datagen",
    "crates/mf-tune",
    "crates/mf-lab",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Manifold contributors"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.build-override]
opt-level = 3

# Loading the ~106 MiB network means quantising and permuting millions of weights. At
# `opt-level = 0` that takes ~1.2 s per process start, which is slower than several of
# the UCI protocol tests' whole time budgets -- they spawn the debug engine and measure
# wall-clock behaviour. Optimising just this crate brings debug startup back under
# 100 ms. Release builds are unaffected, as is the bench node signature.
[profile.dev.package.mf-nnue]
opt-level = 3
